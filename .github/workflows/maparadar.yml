name: MapaRadar (original file)

# Publica a pré-release "rumo-maparadar" com uma cópia IDÊNTICA do data/maparadar.csv (base do MapaRadar, CC BY-NC-ND 4.0,
# que o Clayton atualiza à mão) e o maparadar.json (tamanho e SHA-256). O app baixa e processa o arquivo no aparelho;
# nada derivado dele é publicado. Detalhes em data/README.md.
on:
  push:
    paths:
      - "data/maparadar.csv"
      - "data/maparadar_manifest*.py"
      - ".github/workflows/maparadar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maparadar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test
        run: python3 -m unittest discover -s data -p "maparadar_manifest_test.py" -v

      - name: Manifest and identical copy
        run: |
          python3 data/maparadar_manifest.py data/maparadar.csv publish \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/rumo-maparadar"
          cmp data/maparadar.csv publish/maparadar.csv
          cat publish/maparadar.json
          wc -l data/maparadar.csv

      # Só a main publica
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rumo-maparadar --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create rumo-maparadar publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rumo · MapaRadar (arquivo original)" \
            --notes "Cópia idêntica, sem alterações, da base do MapaRadar (maparadar.com.br), licença CC BY-NC-ND 4.0: uso pessoal, com atribuição e sem fins comerciais. O app Rumo baixa este arquivo e o processa no próprio aparelho (recorte pelos estados instalados e junção com os radares do OpenStreetMap); nada derivado dele é publicado."
