name: MapaRadar (arquivo original)

# Publica a pré-release "rumo-maparadar" com uma cópia IDÊNTICA do dados/maparadar.csv (base do MapaRadar, CC BY-NC-ND 4.0,
# que o Clayton atualiza à mão) e o maparadar.json (tamanho e SHA-256). O app baixa e processa o arquivo no aparelho;
# nada derivado dele é publicado. Detalhes em dados/README.md.
on:
  push:
    paths:
      - "dados/maparadar.csv"
      - "dados/maparadar_manifesto*.py"
      - ".github/workflows/maparadar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maparadar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Teste
        run: python3 -m unittest discover -s dados -p "maparadar_manifesto_test.py" -v

      - name: Manifesto e cópia idêntica
        run: |
          python3 dados/maparadar_manifesto.py dados/maparadar.csv publicar \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/rumo-maparadar"
          cmp dados/maparadar.csv publicar/maparadar.csv
          cat publicar/maparadar.json
          wc -l dados/maparadar.csv

      # Só a main publica
      - name: Publicar em Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rumo-maparadar --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create rumo-maparadar publicar/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rumo · MapaRadar (arquivo original)" \
            --notes "Cópia idêntica, sem alterações, da base do MapaRadar (maparadar.com.br), licença CC BY-NC-ND 4.0: uso pessoal, com atribuição e sem fins comerciais. O app Rumo baixa este arquivo e o processa no próprio aparelho (recorte pelos estados instalados e junção com os radares do OpenStreetMap); nada derivado dele é publicado."
