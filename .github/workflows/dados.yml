name: Dados do mapa (OSM)

# Dados offline por estado (Sul e Sudeste): cada estado tem mapa.pmtiles (mapa vetorial) e vias.db (ruas, limites e
# radares); as fontes dos nomes de rua são comuns. O app lê o dados.json, lista os estados e baixa os escolhidos.
# Publica a pré-release "rumo-dados" (pré-release para nunca ser a "última" release, que é a do APK estável).
# Detalhes do pacote em dados/README.md.
on:
  push:
    paths:
      - "dados/**"
      - "!dados/maparadar.csv"
      - "!dados/maparadar_manifesto*.py"
      - ".github/workflows/dados.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"   # todo dia 1, dados novos do OSM

permissions:
  contents: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zoom máximo do mapa: acima disso o MapLibre amplia o último nível (o app chega a 16,5)
  ZOOM: "14"
  PMTILES: "1.31.2"
  # Ordem em que os estados aparecem no app (Sul, depois Sudeste); os nomes e grupos vêm de dados/regioes/<id>.geojson
  ESTADOS: "pr sc rs sp rj mg es"

jobs:
  estado:
    name: dados ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # pbf: recorte da Geofabrik que contém o estado (região Sul ou Sudeste)
          - { id: pr, pbf: sul }
          - { id: sc, pbf: sul }
          - { id: rs, pbf: sul }
          - { id: sp, pbf: sudeste }
          - { id: rj, pbf: sudeste }
          - { id: mg, pbf: sudeste }
          - { id: es, pbf: sudeste }
    env:
      ID: ${{ matrix.id }}
      # Contorno do estado com ~8 km de folga (para continuar andando além da divisa): dados/regioes/
      CONTORNO: dados/regioes/${{ matrix.id }}.geojson
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ferramentas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install "osmium>=3.7" pmtiles mapbox-vector-tile==2.2.0 shapely
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES}/go-pmtiles_${PMTILES}_Linux_x86_64.tar.gz" | tar xz pmtiles
          ./pmtiles version || true

      - name: Testes do gerador
        run: python3 -m unittest discover -s dados -p "*_test.py" -v

      - name: Nome do estado
        run: |
          NOME=$(python3 -c "import json;print(json.load(open('$CONTORNO', encoding='utf-8'))['properties']['nome'])")
          echo "REGIAO=$NOME" >> "$GITHUB_ENV"

      - name: Baixar o OSM (região ${{ matrix.pbf }}) e recortar
        run: |
          curl -fsSL --retry 3 -o regiao.osm.pbf "https://download.geofabrik.de/south-america/brazil/${{ matrix.pbf }}-latest.osm.pbf"
          osmium extract -p "$CONTORNO" regiao.osm.pbf -o recorte.osm.pbf
          osmium tags-filter recorte.osm.pbf w/highway n/highway=speed_camera -o vias.osm.pbf
          ls -la *.pbf

      - name: Vias, limites e radares
        run: |
          mkdir -p "Rumo/regioes/$ID"
          python3 dados/vias.py vias.osm.pbf "Rumo/regioes/$ID/vias.db" "$REGIAO"
          # O contorno vai junto: o app recorta por ele os radares do MapaRadar (workflow maparadar.yml)
          cp "$CONTORNO" "Rumo/regioes/$ID/contorno.geojson"

      # Mapa vetorial: recorte do mapa-múndi diário do Protomaps (OSM, licença ODbL)
      - name: Mapa vetorial
        run: |
          for i in $(seq 0 14); do
            D=$(date -u -d "-$i day" +%Y%m%d)
            if curl -fsI "https://build.protomaps.com/$D.pmtiles" > /dev/null; then BUILD="https://build.protomaps.com/$D.pmtiles"; break; fi
          done
          echo "Base: $BUILD"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          ./pmtiles extract "$BUILD" mapa-bruto.pmtiles --region="$CONTORNO" --maxzoom="$ZOOM" --download-threads=8
          ls -la mapa-bruto.pmtiles
          # Só o que o estilo do app desenha (água, rios, vias para carro e seus nomes): ver dados/mapa_filtro.py
          python3 dados/mapa_filtro.py mapa-bruto.pmtiles "Rumo/regioes/$ID/mapa.pmtiles"
          ./pmtiles verify "Rumo/regioes/$ID/mapa.pmtiles"
          # A recodificação descarta geometrias inválidas sem avisar: falha se sumir mais de 1% das vias e da água
          python3 dados/mapa_confere.py mapa-bruto.pmtiles "Rumo/regioes/$ID/mapa.pmtiles"
          ./pmtiles show "Rumo/regioes/$ID/mapa.pmtiles" | head -30

      - name: Tamanhos
        run: |
          {
            echo "## Tamanhos ($REGIAO)"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            echo "| mapa bruto (recorte do Protomaps, antes do filtro) | $(du -h mapa-bruto.pmtiles | cut -f1) |"
            echo "| mapa.pmtiles | $(du -h Rumo/regioes/$ID/mapa.pmtiles | cut -f1) |"
            echo "| vias.db | $(du -h Rumo/regioes/$ID/vias.db | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dados-${{ matrix.id }}
          path: Rumo
          retention-days: 2

  publicar:
    name: manifesto e publicação
    needs: estado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: dados-*
          path: estados

      - name: Fontes dos nomes de rua
        run: |
          for f in "Noto Sans Medium:NotoSansMedium" "Noto Sans Regular:NotoSansRegular"; do
            NOME="${f%%:*}"; PASTA="comum/fontes/${f##*:}"
            mkdir -p "$PASTA"
            for r in 0-255 256-511 8192-8447; do
              curl -fsSL -o "$PASTA/$r.pbf" "https://raw.githubusercontent.com/protomaps/basemaps-assets/main/fonts/${NOME// /%20}/$r.pbf"
            done
          done

      - name: Manifesto
        run: |
          ARGS=()
          for id in $ESTADOS; do
            test -f "estados/dados-$id/regioes/$id/mapa.pmtiles" -a -f "estados/dados-$id/regioes/$id/vias.db"
            INFO=$(python3 -c "import json;p=json.load(open('dados/regioes/$id.geojson', encoding='utf-8'))['properties'];print(p['nome']+'='+p['grupo'])")
            # id=nome=pasta=grupo
            ARGS+=("$id=${INFO%%=*}=estados/dados-$id=${INFO##*=}")
          done
          python3 dados/manifesto.py publicar \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/rumo-dados" comum "${ARGS[@]}"
          ls -la publicar

      # Um zip por estado, para copiar à mão: a pasta Rumo pronta (fontes + o estado)
      - name: Pacotes por estado
        run: |
          for id in $ESTADOS; do
            NOME=$(python3 -c "import json;print(json.load(open('dados/regioes/$id.geojson', encoding='utf-8'))['properties']['nome'])")
            P="pacote/$id/Rumo"
            mkdir -p "$P"
            cp -r comum/fontes "$P/"
            cp -r "estados/dados-$id/regioes" "$P/"
            {
              echo "Dados do OpenStreetMap (© colaboradores do OpenStreetMap, licença ODbL)."
              echo "Os radares do MapaRadar (CC BY-NC-ND 4.0) o app baixa à parte: copie o maparadar.csv original para a pasta Rumo."
              echo "Estado: $NOME · gerado em $(date -u +%Y-%m-%d)"
              echo "Copie a pasta Rumo para a memória interna do aparelho."
            } > "$P/LEIAME.txt"
            (cd "pacote/$id" && zip -qr "../../rumo-dados-$id.zip" Rumo)
          done
          ls -la rumo-dados-*.zip

      - name: Tamanhos
        run: |
          {
            echo "## Pacotes"
            echo
            echo "| Estado | mapa.pmtiles | vias.db | zip |"
            echo "|---|---|---|---|"
            for id in $ESTADOS; do
              echo "| $id | $(du -h estados/dados-$id/regioes/$id/mapa.pmtiles | cut -f1) | $(du -h estados/dados-$id/regioes/$id/vias.db | cut -f1) | $(du -h rumo-dados-$id.zip | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Só a main publica: em outras branches o workflow serve para conferir os tamanhos e os testes
      - name: Publicar em Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rumo-dados --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create rumo-dados rumo-dados-*.zip publicar/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rumo · dados do mapa (Sul e Sudeste)" \
            --notes "Mapa, vias, limites e radares dos estados do Sul e do Sudeste, do OpenStreetMap (© colaboradores do OpenStreetMap, ODbL). Os radares, lombadas, pedágios e pontos da polícia rodoviária do MapaRadar (CC BY-NC-ND 4.0, uso pessoal) vão numa release à parte, com o arquivo original. O app lista os estados e baixa os escolhidos sozinho (painel Rumo: 7 toques no relógio); para copiar à mão, descompacte o rumo-dados-<estado>.zip e leve a pasta Rumo para a memória interna do aparelho (vários estados: copie cada um para a mesma pasta Rumo). Instruções em dados/README.md."
