name: Build

# Compila e testa o launcher e entrega o APK como artefato "rumo-apk" (dist/rumo.apk).
# Chamado pelo nightly.yml e pelo release.yml; não roda sozinho.
on:
  workflow_call:
    inputs:
      version_name:
        description: "Versão exata (ex.: 1.2.3). Vazia: última tag estável + -nightly.N"
        type: string
        required: false
        default: ""
    outputs:
      version_name:
        description: "versionName usado no APK"
        value: ${{ jobs.apk.outputs.version_name }}
      version_code:
        description: "versionCode usado no APK"
        value: ${{ jobs.apk.outputs.version_code }}

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # a contagem de commits dá o versionCode e as tags dão a base do nightly

      - name: Version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          if [ -n "$VERSION_INPUT" ]; then
            NAME="${VERSION_INPUT#v}"   # aceita "v1.2.3" (nome da tag) ou "1.2.3"
          else
            BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)
            NAME="${BASE:-0.0.0}-nightly.${COUNT}"
          fi
          # 1000 + commits: o versionCode sempre cresce e fica acima das versões anteriores à migração do repositório
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + COUNT))" >> "$GITHUB_OUTPUT"
          echo "Versão $NAME (versionCode $((1000 + COUNT)))"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # A chave fixa do projeto vem de segredos do repositório. Sem ela, um push (que publica) falha; à mão, o APK sai
      # assinado com a chave de depuração do SDK e não instala por cima de versões assinadas com a chave do projeto.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.RUMO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/rumo.jks"
            echo "RUMO_KEYSTORE=$RUNNER_TEMP/rumo.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Publicar com outra chave faria o aparelho recusar a atualização ("conflito de assinatura")
            echo "::error::RUMO_KEYSTORE_B64 não definido: nada é publicado sem a chave do projeto"
            exit 1
          else
            echo "::warning::RUMO_KEYSTORE_B64 não definido: APK com a chave de depuração do SDK"
          fi

      - name: Build and test
        working-directory: android
        env:
          RUMO_KEYSTORE_PASSWORD: ${{ secrets.RUMO_KEYSTORE_PASSWORD }}
          RUMO_KEY_ALIAS: ${{ secrets.RUMO_KEY_ALIAS }}
          RUMO_KEY_PASSWORD: ${{ secrets.RUMO_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :launcher:assembleRelease :launcher:testDebugUnitTest \
            -PrumoVersionName="$VERSION_NAME" -PrumoVersionCode="$VERSION_CODE"
          mkdir -p ../dist
          cp launcher/build/outputs/apk/release/launcher-release.apk ../dist/rumo.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rumo-apk
          path: dist/rumo.apk
