name: Map data (OSM)

# Dados offline por estado (Sul e Sudeste): cada estado tem map.pmtiles (mapa vetorial) e roads.db (ruas, limites e
# radares); as fontes dos nomes de rua são comuns. O app lê o data.json, lista os estados e baixa os escolhidos.
# Publica a pré-release "rumo-data" (pré-release para nunca ser a "última" release, que é a do APK estável).
# Detalhes do pacote em data/README.md.
on:
  push:
    paths:
      - "data/**"
      - "!data/maparadar.csv"
      - "!data/maparadar_manifest*.py"
      - ".github/workflows/map-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"   # todo dia 1, dados novos do OSM

permissions:
  contents: write

concurrency:
  group: map-data-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zoom máximo do mapa: acima disso o MapLibre amplia o último nível (o app chega a 16,5)
  ZOOM: "14"
  PMTILES: "1.31.2"
  # Ordem em que os estados aparecem no app (Sul, depois Sudeste); os nomes e grupos vêm de data/regions/<id>.geojson
  STATES: "pr sc rs sp rj mg es"

jobs:
  state:
    name: data ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # pbf: recorte da Geofabrik que contém o estado (região Sul ou Sudeste)
          - { id: pr, pbf: sul }
          - { id: sc, pbf: sul }
          - { id: rs, pbf: sul }
          - { id: sp, pbf: sudeste }
          - { id: rj, pbf: sudeste }
          - { id: mg, pbf: sudeste }
          - { id: es, pbf: sudeste }
    env:
      ID: ${{ matrix.id }}
      # Contorno do estado com ~8 km de folga (para continuar andando além da divisa): data/regions/
      CONTOUR: data/regions/${{ matrix.id }}.geojson
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install "osmium>=3.7" pmtiles mapbox-vector-tile==2.2.0 shapely
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES}/go-pmtiles_${PMTILES}_Linux_x86_64.tar.gz" | tar xz pmtiles
          ./pmtiles version || true

      - name: Generator tests
        run: python3 -m unittest discover -s data -p "*_test.py" -v

      - name: State name
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('$CONTOUR', encoding='utf-8'))['properties']['name'])")
          echo "REGION=$NAME" >> "$GITHUB_ENV"

      - name: Download the OSM (region ${{ matrix.pbf }}) and cut
        run: |
          curl -fsSL --retry 3 -o region.osm.pbf "https://download.geofabrik.de/south-america/brazil/${{ matrix.pbf }}-latest.osm.pbf"
          osmium extract -p "$CONTOUR" region.osm.pbf -o extract.osm.pbf
          osmium tags-filter extract.osm.pbf w/highway n/highway=speed_camera -o roads.osm.pbf
          ls -la *.pbf

      - name: Roads, limits and radars
        run: |
          mkdir -p "Rumo/regions/$ID"
          python3 data/roads.py roads.osm.pbf "Rumo/regions/$ID/roads.db" "$REGION"
          # O contorno vai junto: o app recorta por ele os radares do MapaRadar (workflow maparadar.yml)
          cp "$CONTOUR" "Rumo/regions/$ID/contour.geojson"

      # Mapa vetorial: recorte do mapa-múndi diário do Protomaps (OSM, licença ODbL)
      - name: Vector map
        run: |
          for i in $(seq 0 14); do
            D=$(date -u -d "-$i day" +%Y%m%d)
            if curl -fsI "https://build.protomaps.com/$D.pmtiles" > /dev/null; then BUILD="https://build.protomaps.com/$D.pmtiles"; break; fi
          done
          echo "Base: $BUILD"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          ./pmtiles extract "$BUILD" raw-map.pmtiles --region="$CONTOUR" --maxzoom="$ZOOM" --download-threads=8
          ls -la raw-map.pmtiles
          # Só o que o estilo do app desenha (água, rios, vias para carro e seus nomes): ver data/map_filter.py
          python3 data/map_filter.py raw-map.pmtiles "Rumo/regions/$ID/map.pmtiles"
          ./pmtiles verify "Rumo/regions/$ID/map.pmtiles"
          # A recodificação descarta geometrias inválidas sem avisar: falha se sumir mais de 1% das vias e da água
          python3 data/map_check.py raw-map.pmtiles "Rumo/regions/$ID/map.pmtiles"
          ./pmtiles show "Rumo/regions/$ID/map.pmtiles" | head -30

      - name: Sizes
        run: |
          {
            echo "## Tamanhos ($REGION)"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            echo "| mapa bruto (recorte do Protomaps, antes do filtro) | $(du -h raw-map.pmtiles | cut -f1) |"
            echo "| map.pmtiles | $(du -h Rumo/regions/$ID/map.pmtiles | cut -f1) |"
            echo "| roads.db | $(du -h Rumo/regions/$ID/roads.db | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.id }}
          path: Rumo
          retention-days: 2

  publish:
    name: manifest and publish
    needs: state
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: states

      - name: Street-name fonts
        run: |
          for f in "Noto Sans Medium:NotoSansMedium" "Noto Sans Regular:NotoSansRegular"; do
            NAME="${f%%:*}"; DIR="common/fonts/${f##*:}"
            mkdir -p "$DIR"
            for r in 0-255 256-511 8192-8447; do
              curl -fsSL -o "$DIR/$r.pbf" "https://raw.githubusercontent.com/protomaps/basemaps-assets/main/fonts/${NAME// /%20}/$r.pbf"
            done
          done

      - name: Manifest
        run: |
          ARGS=()
          for id in $STATES; do
            test -f "states/data-$id/regions/$id/map.pmtiles" -a -f "states/data-$id/regions/$id/roads.db"
            INFO=$(python3 -c "import json;p=json.load(open('data/regions/$id.geojson', encoding='utf-8'))['properties'];print(p['name']+'='+p['group'])")
            # id=nome=pasta=grupo
            ARGS+=("$id=${INFO%%=*}=states/data-$id=${INFO##*=}")
          done
          python3 data/manifest.py publish \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/rumo-data" common "${ARGS[@]}"
          ls -la publish

      # Um zip por estado, para copiar à mão: a pasta Rumo pronta (fontes + o estado)
      - name: Per-state packages
        run: |
          for id in $STATES; do
            NAME=$(python3 -c "import json;print(json.load(open('data/regions/$id.geojson', encoding='utf-8'))['properties']['name'])")
            P="package/$id/Rumo"
            mkdir -p "$P"
            cp -r common/fonts "$P/"
            cp -r "states/data-$id/regions" "$P/"
            {
              echo "Dados do OpenStreetMap (© colaboradores do OpenStreetMap, licença ODbL)."
              echo "Os radares do MapaRadar (CC BY-NC-ND 4.0) o app baixa à parte: copie o maparadar.csv original para a pasta Rumo."
              echo "Estado: $NAME · gerado em $(date -u +%Y-%m-%d)"
              echo "Copie a pasta Rumo para a memória interna do aparelho."
            } > "$P/README.txt"
            (cd "package/$id" && zip -qr "../../rumo-data-$id.zip" Rumo)
          done
          ls -la rumo-data-*.zip

      - name: Sizes
        run: |
          {
            echo "## Pacotes"
            echo
            echo "| Estado | map.pmtiles | roads.db | zip |"
            echo "|---|---|---|---|"
            for id in $STATES; do
              echo "| $id | $(du -h states/data-$id/regions/$id/map.pmtiles | cut -f1) | $(du -h states/data-$id/regions/$id/roads.db | cut -f1) | $(du -h rumo-data-$id.zip | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Só a main publica: em outras branches o workflow serve para conferir os tamanhos e os testes
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rumo-data --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create rumo-data rumo-data-*.zip publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rumo · dados do mapa (Sul e Sudeste)" \
            --notes "Mapa, vias, limites e radares dos estados do Sul e do Sudeste, do OpenStreetMap (© colaboradores do OpenStreetMap, ODbL). Os radares, lombadas, pedágios e pontos da polícia rodoviária do MapaRadar (CC BY-NC-ND 4.0, uso pessoal) vão numa release à parte, com o arquivo original. O app lista os estados e baixa os escolhidos sozinho (engrenagem › Configurações da home); para copiar à mão, descompacte o rumo-data-<estado>.zip e leve a pasta Rumo para a memória interna do aparelho (vários estados: copie cada um para a mesma pasta Rumo). Instruções em data/README.md."
