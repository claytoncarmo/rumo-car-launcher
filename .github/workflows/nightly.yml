name: Nightly

# A cada push na main que mexe no app: compila, testa e substitui a pré-release "nightly" (canal instável).
# As novidades mostradas no app vêm de release-notes/next.md (regras em release-notes/README.md).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/nightly.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

# Só leitura por padrão; escrita só no job que publica (o build roda Gradle e plugins de terceiros com a chave)
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rumo-apk
          path: dist

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version_name }}
          CODE: ${{ needs.build.outputs.version_code }}
        run: |
          bash .github/scripts/rumo-json.sh dist/rumo.apk "$VERSION" "$CODE" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/rumo.apk" dist/rumo.json release-notes/next.md
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly dist/rumo.apk dist/rumo.json \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rumo · nightly" \
            --notes "Versão $VERSION, compilada de ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) a cada mudança no app. Canal instável: para o canal estável, veja a última versão em Releases."
