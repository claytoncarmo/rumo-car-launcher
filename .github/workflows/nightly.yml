name: Nightly

# A cada push na main que mexe no app: compila, testa e substitui a pré-release "nightly" (canal instável).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rumo-apk
          path: dist

      - name: Publicar a pré-release nightly
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly dist/rumo.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rumo · nightly" \
            --notes "Versão $VERSION, compilada de ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) a cada mudança no app. Canal instável: para o canal estável, veja a última versão em Releases."
